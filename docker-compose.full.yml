services:
  postgres-app:
    image: postgres:16
    environment:
      POSTGRES_DB: querysmith
      POSTGRES_USER: querysmith
      POSTGRES_PASSWORD: dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querysmith"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["app-db:/var/lib/postgresql/data"]
  postgres-chinook:
    image: postgres:16
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - chinook-db:/var/lib/postgresql/data
      - ./infra/docker/chinook:/docker-entrypoint-initdb.d:ro
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    depends_on:
      postgres-app: {condition: service_healthy}
      postgres-chinook: {condition: service_healthy}
    ports: ["8000:8000"]
  ui:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ui
    environment:
      QS_API_URL: http://api:8000
      QS_UI_API_KEY: ${QS_UI_API_KEY:-}
    depends_on: [api]
    ports: ["8501:8501"]
volumes:
  app-db:
  chinook-db:
